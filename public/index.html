<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <main class="container">
        <header class="hero">
            <div class="logo">
                <i class="fa-brands fa-youtube"></i>
            </div>
            <h1>YT Downloader</h1>
            <p>Download your favorite videos and audio with premium speed.</p>
        </header>

        <section class="glass-panel downloader-section">
            <form id="downloadForm">
                <div class="input-group">
                    <i class="fa-solid fa-link input-icon"></i>
                    <input type="text" id="urlInput" placeholder="Paste YouTube URL here..." required autocomplete="off">
                </div>
                
                <div class="format-toggle">
                    <input type="radio" id="formatVideo" name="format" value="video" checked>
                    <label for="formatVideo" class="toggle-btn"><i class="fa-solid fa-video"></i> Video (MP4)</label>
                    
                    <input type="radio" id="formatAudio" name="format" value="audio">
                    <label for="formatAudio" class="toggle-btn"><i class="fa-solid fa-music"></i> Audio (MP3)</label>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">
                    <span class="btn-text">Download</span>
                    <span class="loader" style="display: none;"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
                </button>
            </form>

            <div id="resultArea" class="result-area hidden">
                <div class="success-message">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Ready to download!</p>
                    <a href="#" id="downloadLink" class="btn-download" download>Click to Save <i class="fa-solid fa-download"></i></a>
                </div>
                <div class="error-message">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <p id="errorText">Something went wrong.</p>
                </div>
            </div>
        </section>

        <section class="glass-panel history-section">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Download History</h2>
            <ul id="historyList" class="history-list">
                <!-- History items will be injected here -->
            </ul>
            <button id="clearHistoryBtn" class="btn-text-only">Clear History</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
