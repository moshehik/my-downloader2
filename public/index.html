<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הורדות מיוטיוב</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <main class="container">
        <header class="hero">
            <div class="logo">
                <i class="fa-brands fa-youtube"></i>
            </div>
            <h1>מוריד היוטיוב</h1>
            <p>הורד את הסרטונים והשירים האהובים עליך במהירות פרימיום.</p>
        </header>

        <section class="glass-panel downloader-section">
            <form id="downloadForm">
                <div class="input-group">
                    <i class="fa-solid fa-link input-icon"></i>
                    <input type="text" id="urlInput" placeholder="הדבק כאן קישור ליוטיוב..." required autocomplete="off">
                </div>
                
                <div id="thumbnailPreview" style="display: none; margin-bottom: 1.5rem; text-align: center;">
                    <img id="thumbnailImg" src="" alt="תצוגה מקדימה" style="max-width: 100%; max-height: 200px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); object-fit: cover;">
                </div>
                
                <div class="format-toggle">
                    <input type="radio" id="formatVideo" name="format" value="video" checked>
                    <label for="formatVideo" class="toggle-btn"><i class="fa-solid fa-video"></i> וידאו (MP4)</label>
                    
                    <input type="radio" id="formatAudio" name="format" value="audio">
                    <label for="formatAudio" class="toggle-btn"><i class="fa-solid fa-music"></i> שמע (MP3)</label>
                </div>
                
                <div class="zip-toggle" style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; justify-content: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px;">
                    <input type="checkbox" id="zipOption" name="zipOption" style="width: 18px; height: 18px;">
                    <label for="zipOption" style="cursor: pointer;">קודד ל-ZIP עם סיסמה 1234 (לעקיפת סינון)</label>
                </div>
                
                <div class="drive-toggle" style="margin-bottom: 2rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="driveOption" name="driveOption" style="width: 18px; height: 18px;">
                        <label for="driveOption" style="cursor: pointer;"><i class="fa-brands fa-google-drive"></i> שמור לגוגל דרייב ושלח במייל</label>
                    </div>
                    <div id="emailContainer" style="display: none; width: 100%; margin-top: 10px;">
                        <input type="email" id="emailInput" placeholder="הכנס כתובת אימייל (אופציונלי)" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); color: white;">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">
                    <span class="btn-text">הורד עכשיו</span>
                    <span class="loader" style="display: none;"><i class="fa-solid fa-circle-notch fa-spin"></i> מעבד...</span>
                </button>
            </form>

            <div id="resultArea" class="result-area hidden">
                <div class="success-message">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>הקובץ מוכן!</p>
                    <a href="#" id="downloadLink" class="btn-download" download>לחץ כאן לשמירה <i class="fa-solid fa-download"></i></a>
                </div>
                <div class="error-message">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <p id="errorText">משהו השתבש.</p>
                </div>
            </div>
        </section>

        <section class="glass-panel history-section">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> היסטוריית הורדות</h2>
            <ul id="historyList" class="history-list">
                <!-- History items will be injected here -->
            </ul>
            <button id="clearHistoryBtn" class="btn-text-only">נקה היסטוריה</button>
        </section>
    </main>

    <script src="script.js?v=5"></script>
</body>
</html>
